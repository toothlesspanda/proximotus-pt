<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <!-- Pipes atrás (começam acima e vão até ~1/3 da palavra) -->
  <!-- Pipe horizontal que dobra para baixo (vermelha) -->
  <g opacity="0.7">
    <path d="M20 16 L160 16 Q180 16 180 36 L180 112" stroke="#ee1c25" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 -4 L100 112" stroke="#f6c700" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M20 80 L220 80" stroke="#00a651" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="16" r="9" fill="#1a1a2e" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- Proximotus text -->
  <text x="240" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="72" fill="#fff" stroke="#000" stroke-width="6" paint-order="stroke" letter-spacing="-2">Proximotus</text>
</svg>
